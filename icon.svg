<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1a1c"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#39ff14"/>
      <stop offset="100%" stop-color="#1fcc0a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.5" stdDeviation="1" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Фон (адаптивный круг) -->
  <circle cx="24" cy="24" r="22" fill="url(#bgGrad)" stroke="#2c2c2e" stroke-width="1"/>

  <!-- Декоративная обводка акцентом -->
  <circle cx="24" cy="24" r="22" fill="none" stroke="url(#accentGrad)" stroke-width="0.8" opacity="0.5"/>

  <!-- Гриф гитары -->
  <rect x="20" y="8" width="8" height="32" rx="1" fill="#d4a373" />

  <!-- Лады (5 линий) -->
  <line x1="20" y1="13.3" x2="28" y2="13.3" stroke="#555" stroke-width="1"/>
  <line x1="20" y1="18.7" x2="28" y2="18.7" stroke="#555" stroke-width="1"/>
  <line x1="20" y1="24" x2="28" y2="24" stroke="#555" stroke-width="1"/>
  <line x1="20" y1="29.3" x2="28" y2="29.3" stroke="#555" stroke-width="1"/>
  <line x1="20" y1="34.7" x2="28" y2="34.7" stroke="#555" stroke-width="1"/>

  <!-- Струны (6 штук) -->
  <line x1="21" y1="8" x2="21" y2="40" stroke="#fff" stroke-width="0.6" opacity="0.9"/>
  <line x1="22.2" y1="8" x2="22.2" y2="40" stroke="#fff" stroke-width="0.6" opacity="0.9"/>
  <line x1="23.4" y1="8" x2="23.4" y2="40" stroke="#fff" stroke-width="0.6" opacity="0.9"/>
  <line x1="24.6" y1="8" x2="24.6" y2="40" stroke="#fff" stroke-width="0.6" opacity="0.9"/>
  <line x1="25.8" y1="8" x2="25.8" y2="40" stroke="#fff" stroke-width="0.6" opacity="0.9"/>
  <line x1="27" y1="8" x2="27" y2="40" stroke="#fff" stroke-width="0.6" opacity="0.9"/>

  <!-- Голова грифа с колками -->
  <rect x="18" y="5" width="12" height="5" rx="1.5" fill="#d4a373" />
  <circle cx="17.5" cy="6" r="1.5" fill="#888"/>
  <circle cx="17.5" cy="7" r="1.5" fill="#888"/>
  <circle cx="17.5" cy="8" r="1.5" fill="#888"/>
  <circle cx="30.5" cy="6" r="1.5" fill="#888"/>
  <circle cx="30.5" cy="7" r="1.5" fill="#888"/>
  <circle cx="30.5" cy="8" r="1.5" fill="#888"/>

  <!-- Пятка грифа -->
  <rect x="18" y="40" width="12" height="3" rx="1" fill="#d4a373" />

  <!-- Нажатая точка (акцент) – 2-я струна, 2-й лад -->
  <circle cx="22.2" cy="16" r="2.5" fill="url(#accentGrad)" filter="url(#shadow)"/>
</svg>